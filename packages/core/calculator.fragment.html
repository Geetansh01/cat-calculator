<div class="ui-dialog ui-corner-all ui-widget ui-widget-content ui-front" style="position: absolute; width: 225px;">
        <div class="ui-dialog-titlebar ui-corner-all ui-widget-header ui-helper-clearfix ui-draggable-handle">
            <span class="ui-dialog-title">Calculator</span>
            <button type="button" class="ui-button ui-corner-all ui-widget ui-button-icon-only ui-dialog-titlebar-close"
                title="">
                <span class="ui-button-icon ui-icon ui-icon-closethick"></span>
            </button>
        </div>
        <div id="keyPad" class="calc_container ui-dialog-content ui-widget-content"
            style="width: auto; display: block;">
            <div id="mainContentArea">
                <input id="keyPad_UserInput1" class="keyPad_TextBox1" readonly type="text"
                    style="width: 188px !important;">
                <div class="text_container">
                    <input id="keyPad_UserInput" class="keyPad_TextBox" maxlength="30" readonly type="text"
                        style="width: 188px !important;">
                    <span id="memory" class="memoryhide importantRuleMemory1" style="height: 22px; right: 192px;">
                        <font size="2">M</font>
                    </span>
                </div>
                <div class="clear"></div>
                <div class="left_sec">
                    <div class="calc_row clear">
                        <a id="keyPad_MC" class="keyPad_btnMemoryOp" style="margin-right: 3px;">MC</a>
                        <a id="keyPad_MR" class="keyPad_btnMemoryOp" style="margin-right: 3px;">MR</a>
                        <a id="keyPad_MS" class="keyPad_btnMemoryOp" style="margin-right: 3px;">MS</a>
                        <a id="keyPad_M+" class="keyPad_btnMemoryOp" style="margin-right: 3px;">M+</a>
                        <a id="keyPad_M-" class="keyPad_btnMemoryOp" style="margin-right: 3px;">M-</a>
                    </div>
                    <div class="calc_row clear">
                        <a id="keyPad_btnBack" class="keyPad_btnCommand calc_arrows" style="width: 72px !important;">
                            <div style="position: relative; top: -3px">←</div>
                        </a>
                        <a id="keyPad_btnAllClr" class="keyPad_btnCommand" style="margin-right: 3px;">C</a>
                        <a id="keyPad_btnInverseSign" class="keyPad_btnUnaryOp" style="margin-right: 3px;">+/-</a>
                        <a id="keyPad_btnSquareRoot" class="keyPad_btnUnaryOp" style="margin-right: 3px;">
                            <div style="position: relative; top: 1px; font-size: 19px;">√</div>
                        </a>
                    </div>
                    <div class="calc_row clear" style="margin-top: 5px;">
                        <a id="keyPad_btn7" class="keyPad_btnNumeric" style="margin-right: 3px;">7</a>
                        <a id="keyPad_btn8" class="keyPad_btnNumeric" style="margin-right: 3px;">8</a>
                        <a id="keyPad_btn9" class="keyPad_btnNumeric" style="margin-right: 3px;">9</a>
                        <a id="keyPad_btnDiv" class="keyPad_btnBinaryOp" style="margin-right: 3px; font-size: 18px;">/</a>
                        <a id="keyPad_%" class="keyPad_btnBinaryOp" style="margin-right: 3px;  font-size: 19px;">%</a>
                    </div>
                    <div class="calc_row clear">
                        <a id="keyPad_btn4" class="keyPad_btnNumeric" style="margin-right: 3px;">4</a>
                        <a id="keyPad_btn5" class="keyPad_btnNumeric" style="margin-right: 3px;">5</a>
                        <a id="keyPad_btn6" class="keyPad_btnNumeric" style="margin-right: 3px;">6</a>
                        <a id="keyPad_btnMult" class="keyPad_btnBinaryOp" style="margin-right: 3px; font-size: 23px; padding-top: 4px;">*</a>
                        <a id="keyPad_btnInverse" class="keyPad_btnUnaryOp" style="margin-right: 3px;"><span
                                class="baseele">1/x</span></a>
                    </div>
                    <div class="calc_row clear">
                        <a id="keyPad_btn1" class="keyPad_btnNumeric" style="margin-right: 3px;">1</a>
                        <a id="keyPad_btn2" class="keyPad_btnNumeric" style="margin-right: 3px;">2</a>
                        <a id="keyPad_btn3" class="keyPad_btnNumeric" style="margin-right: 3px;">3</a>
                        <a id="keyPad_btnMinus" class="keyPad_btnBinaryOp" style="margin-right: 3px; font-size: 23px; padding-top: 1px;">-</a>
                    </div>
                    <div class="calc_row clear">
                        <a id="keyPad_btn0" class="keyPad_btnNumeric" style="width: 72px !important;">0</a>
                        <a id="keyPad_btnDot" class="keyPad_btnNumeric" style="margin-right: 3px; font-size: 20px;">.</a>
                        <a id="keyPad_btnPlus" class="keyPad_btnBinaryOp" style="margin-right: 3px; font-size: 22px;">+</a>
                        <a id="keyPad_btnEnter" class="keyPad_btnCommand importantRule1"
                            style="height: 53px !important;">
                            <div style="margin-bottom: 2px;">=</div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
